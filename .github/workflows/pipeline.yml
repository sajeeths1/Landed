name: Job pipeline

on:
  schedule:
    # GitHub uses UTC time. Times below are Eastern (winter); in summer each runs 1 hour later.
    # Mon-Fri every 2 hours: 7am, 9am, 11am, 1pm, 3pm, 5pm
    - cron: "0 12,14,16,18,20,22 * * 1-5"
    # Mon-Fri evening and night: 7pm, then every 4 hours at 11pm and 3am
    - cron: "0 0,4,8 * * 2-6"
    # Sat-Sun every 4 hours: 8am, 12pm, 4pm
    - cron: "0 13,17,21 * * 0,6"
    # Sat-Sun 8pm, then 2am overnight (every 6 hours)
    - cron: "0 1,7 * * 0,1"
  workflow_dispatch:         # adds a "Run workflow" button

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # ~800 company boards per run after discovery
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/worker/requirements.txt

      - run: pip install -r requirements.txt

      - run: python pipeline.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
